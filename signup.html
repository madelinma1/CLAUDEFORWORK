<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reserva tu lugar | VISIBLE</title>
<meta name="description" content="Deja tus datos para reservar tu lugar en el bootcamp ejecutivo VISIBLE.">
<style>
  :root{
    --ink:#14161c;
    --ink-soft:#4c505c;
    --cream:#f7f7f5;
    --cream-dark:#ececea;
    --navy:#1c2b4a;
    --electric:#3453c4;
    --line:#e2e1dc;
    --white:#ffffff;
    --radius:14px;
    --shadow:0 20px 50px -25px rgba(20,22,28,0.35);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"Helvetica Neue",Arial,sans-serif;
    background:var(--cream);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }
  header{border-bottom:1px solid var(--line);background:var(--white)}
  header .wrap{max-width:1120px;margin:0 auto;padding:18px 24px;display:flex;align-items:center;justify-content:space-between}
  .logo{font-weight:800;font-size:18px;letter-spacing:.04em}
  .logo span{color:var(--electric)}
  .back{font-size:13.5px;font-weight:600;text-decoration:none;color:var(--ink-soft)}

  main{flex:1;display:flex;align-items:center;justify-content:center;padding:48px 20px}
  .card{width:100%;max-width:460px;background:var(--white);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:40px 36px}

  .steps{display:flex;align-items:center;gap:8px;margin-bottom:24px;font-size:12px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em}
  .steps .step{display:flex;align-items:center;gap:8px}
  .steps .dot{width:22px;height:22px;border-radius:50%;background:var(--electric);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px}
  .steps .dot.pending{background:var(--cream-dark);color:var(--ink-soft)}
  .steps .line{width:28px;height:1px;background:var(--line)}

  h1{font-size:26px;margin-bottom:8px}
  .card > p.lead{color:var(--ink-soft);font-size:15px;margin-bottom:28px}

  label{display:block;font-size:13px;font-weight:700;margin-bottom:6px;margin-top:18px}
  label:first-of-type{margin-top:0}
  input{
    width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:10px;
    font-size:15px;font-family:inherit;color:var(--ink);background:var(--cream);
  }
  input:focus{outline:none;border-color:var(--electric);background:var(--white)}

  .btn{
    margin-top:26px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;
    background:var(--electric);color:#fff;border:none;padding:16px;border-radius:100px;
    font-weight:700;font-size:15.5px;cursor:pointer;
    box-shadow:0 12px 26px -10px rgba(52,83,196,0.5);
    transition:transform .18s ease;
  }
  .btn:hover{transform:translateY(-2px)}
  .btn:disabled{opacity:.6;cursor:not-allowed;transform:none}

  .fine-print{margin-top:16px;font-size:12px;color:var(--ink-soft);text-align:center}
  .error{display:none;margin-top:14px;background:#fdeceb;border:1px solid #f2b8b3;color:#9b2c22;font-size:13px;padding:10px 12px;border-radius:8px}
  .error.show{display:block}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="logo">VISIBLE<span>.</span></div>
    <a href="index.html" class="back">← Volver</a>
  </div>
</header>

<main>
  <div class="card">
    <div class="steps">
      <span class="step"><span class="dot">1</span> Tus datos</span>
      <span class="line"></span>
      <span class="step"><span class="dot pending">2</span> Pago</span>
    </div>
    <h1>Reserva tu lugar</h1>
    <p class="lead">Déjanos tus datos para apartar tu cupo en la próxima cohorte de VISIBLE. El siguiente paso es el pago seguro.</p>

    <form id="signup-form">
      <label for="name">Nombre completo</label>
      <input type="text" id="name" name="name" placeholder="Tu nombre" required autocomplete="name">

      <label for="email">Correo electrónico</label>
      <input type="email" id="email" name="email" placeholder="tucorreo@empresa.com" required autocomplete="email">

      <div class="error" id="form-error">Por favor completa tu nombre y un correo válido.</div>

      <button type="submit" class="btn" id="submit-btn">Continuar al pago →</button>
      <p class="fine-print">Tu información solo se usa para confirmar tu lugar. Nunca compartimos tus datos.</p>
    </form>
  </div>
</main>

<script>
  // Leads post here via a Google Apps Script Web App bound to the
  // "VISIBLE — Registros de reserva" sheet, which appends each signup as a
  // row. Paste your deployed /exec URL below once you've set it up (see the
  // Apps Script snippet + deploy steps shared alongside this file).
  var FORM_ENDPOINT = ""; // e.g. "https://script.google.com/macros/s/AKfycb.../exec"

  var form = document.getElementById('signup-form');
  var errorBox = document.getElementById('form-error');
  var submitBtn = document.getElementById('submit-btn');

  form.addEventListener('submit', function(e){
    e.preventDefault();
    var name = document.getElementById('name').value.trim();
    var email = document.getElementById('email').value.trim();

    if(!name || !email){
      errorBox.classList.add('show');
      return;
    }
    errorBox.classList.remove('show');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Redirigiendo…';

    sessionStorage.setItem('visible_name', name);
    sessionStorage.setItem('visible_email', email);

    function goToPayment(){
      var params = new URLSearchParams({ name: name, email: email });
      window.location.href = 'payment.html?' + params.toString();
    }

    if (FORM_ENDPOINT) {
      // mode: 'no-cors' + a form-encoded body avoids a CORS preflight, which
      // Apps Script web apps don't handle. The response is opaque either way
      // (we can't read it), so we just fire the request and move on.
      fetch(FORM_ENDPOINT, {
        method: 'POST',
        mode: 'no-cors',
        body: new URLSearchParams({ name: name, email: email })
      }).then(goToPayment).catch(goToPayment);
    } else {
      goToPayment();
    }
  });
</script>

</body>
</html>
